# [PATCH:STAGE6-CI]
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.lock — best-effort, если файла нет — не падаем
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install -r requirements-dev.txt

      - name: Ruff (non-blocking)
        run: ruff check . || true
        continue-on-error: true

      - name: Mypy (non-blocking, critical files)
        run: |
          mypy app.py services/ routers/ --ignore-missing-imports || true
        continue-on-error: true

      - name: Pytest with coverage
        run: |
          pytest -q --maxfail=5 \
            --cov=app --cov=services --cov=routers \
            --cov-report=json:coverage.json \
            --cov-report=term

      - name: Pip audit (non-blocking)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: ignore
