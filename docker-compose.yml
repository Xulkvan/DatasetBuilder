# [PATCH:STAGE7-compose]
# [STAGE1:compose]
version: "3.9"

services:
  backend:
    build: .
    image: datasetbuilder:local
    container_name: datasetbuilder
    ports:
      - "8000:8000"
    env_file:
      - .env
    # [STAGE5:compose-no-db-engine]
    environment:
      DATA_ROOT: /app
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./thumbs:/app/thumbs
      - ./models:/app/models
      - ./exports:/app/exports
      - ./runs:/app/runs
      - ./videos:/app/videos
      - ./imports:/app/imports
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    profiles: ["team"]
    container_name: datasetbuilder-pg
    environment:
      POSTGRES_DB: ${DB_NAME:-pig_dataset}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
