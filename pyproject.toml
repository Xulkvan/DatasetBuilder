# [PATCH:STAGE5-ci-baseline]
# Stage 5.2 — baseline-конфиг для блокирующих ruff/mypy в CI.
#
# Цель: сделать линтеры блокирующими, но НЕ краснеть на легаси-коде.
# Ruff: только критичные правила (syntax / pyflakes-minimum).
# Mypy: заглушки для легаси-категорий — новый код получит их автоматически,
# [STAGE3:mypy-tightened] removed from disable_error_code: arg-type, assignment, attr-defined
#       когда соответствующие disable_error_code будут убраны.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".git", ".venv", "venv", "node_modules",
  "data", "uploads", "thumbs", "models", "exports",
  "runs", "imports", "backups", "videos",
  "dist", "build", ".backups",
]

[tool.ruff.lint]
# Baseline: только реальные ошибки исполнения Python.
# Не включает F401/F841/etc — легаси-код их содержит.
# [PATCH:STAGE5-ruff-extend] Stage 5.1 — extend ruff baseline:
# F401 unused-import, F841 unused-var, F811 redefinition,
# F821 undefined-name.
select = ["E9", "F63", "F7", "F401", "F841", "F811", "F821"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# [PATCH:STAGE5-ruff-legacy] Stage 5.1 — F401/F841/F811 legacy debt.
#
# Расширение select до F401/F841/F811/F821 — по плану «ловят мёртвый
# код из Этапа 6». Сейчас (Stage 5) эти проверки ВКЛЮЧЕНЫ, и они
# выявили 122 легаси-нарушения, накопленных за прошлые этапы.
#
# По плану: «Возможные false-positive на legacy — добавить ignore по
# конкретным файлам». F821 (undefined name) НЕ игнорируется — он
# поймал 2 реальных бага в Stage 5 (routers/ml.py, routers/auth.py).
#
# Cleanup расписан на Stage 6 (post-1.0). Удаляйте строку за строкой
# по мере очистки файла. Для новых файлов правило не действует.
"tests/*"                       = ["F401", "F841", "F811"]
"app.py"                        = ["F401", "F841", "F811"]
"routers/api_v2.py"             = ["F401", "F841", "F811"]
"routers/assignments.py"        = ["F401", "F841", "F811"]
"routers/images.py"             = ["F401", "F841", "F811"]
"routers/locks.py"              = ["F401", "F841", "F811"]
"routers/ml.py"                 = ["F401", "F841", "F811"]
"routers/projects.py"           = ["F401", "F841", "F811"]
"routers/tags.py"               = ["F401", "F841", "F811"]
"routers/webhooks.py"           = ["F401", "F841", "F811"]
"services/auth_service.py"      = ["F401", "F841", "F811"]
"services/behavior_service.py"  = ["F401", "F841", "F811"]
"services/bootstrap_service.py" = ["F401", "F841", "F811"]
"services/cvat_service.py"      = ["F401", "F841", "F811"]
"services/dataset_card_service.py" = ["F401", "F841", "F811"]
"services/image_service.py"     = ["F401", "F841", "F811"]
"services/ml_service.py"        = ["F401", "F841", "F811"]
"services/pipeline_service.py"  = ["F401", "F841", "F811"]
"services/project_service.py"   = ["F401", "F841", "F811"]
"services/sam_service.py"       = ["F401", "F841", "F811"]
"services/train_service.py"     = ["F401", "F841", "F811"]
"services/trash_service.py"     = ["F401", "F841", "F811"]


[tool.ruff.format]
quote-style = "double"

# [PATCH:STAGE4-C19] mypy baseline snapshot: ~127 errors (see mypy-baseline.txt).
# (actual: assignment=70, arg-type=52, attr-defined=3; annotation-unchecked — 2)
# Goal: reduce by ~10 per release; target <=50 by release 4.
# Strategy: remove one disable_error_code category at a time.
# See pyproject.toml::[tool.mypy].disable_error_code below.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_unused_ignores = false
warn_return_any = false
# Stage 5.2 baseline: категории, которые встречаются в легаси и не
# мешают исполнению. Tighten по одной по мере рефакторинга.
disable_error_code = [

  "call-arg", "call-overload", "union-attr", "return-value",
  "var-annotated", "index", "operator", "misc",
  "name-defined", "no-redef", "override", "comparison-overlap",
  "truthy-bool", "truthy-function", "unreachable", "used-before-def",
  "valid-type", "redundant-cast", "no-untyped-call", "type-var",
  "type-arg", "return", "list-item",

]

# [PATCH:STAGE5-mypy-fix] Указываем mypy, что корень проекта — база пакетов.
# Это решает ошибку "Source file found twice under different module names".
explicit_package_bases = true
mypy_path = "."
