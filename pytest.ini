[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# [PATCH:STAGE6-MARKERS]
markers =
    slow: long-running tests (>30s)
    ml: requires ultralytics / torch
